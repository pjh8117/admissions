<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리집 대학입시 일정</title><style>:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#18253d;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:27px;margin:0}p{color:#66748a}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,.btn{border:1px solid #d9e1ef;background:white;border-radius:10px;padding:10px 13px;font-weight:650;cursor:pointer;color:#263b61}button:hover,.btn:hover{background:#eef3ff}.primary{background:#2456d6;color:white;border-color:#2456d6}.primary:hover{background:#1944b4}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:13px}.school{background:white;border:1px solid #e1e6f0;border-radius:16px;padding:18px;text-align:left;min-height:140px;box-shadow:0 3px 12px #1a3b7010}.school strong{display:block;font-size:18px}.school small{color:#66748a}.pill{display:inline-block;background:#edf3ff;color:#2352bd;border-radius:20px;padding:5px 9px;font-size:12px;margin-top:16px}.detail{background:white;border:1px solid #e1e6f0;border-radius:16px;padding:24px;margin-top:18px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #cdd7e6;border-radius:9px;font:inherit}input:focus{outline:2px solid #b2c8ff}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.datebox{background:#f6f8fd;border:1px solid #e0e7f3;border-radius:12px;padding:12px;margin-top:14px}.datebox label{margin-top:0}.hint{font-size:12px;color:#6d7c91}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.hidden{display:none}.foot{font-size:12px;margin-top:24px}a{color:#2456d6}.date-link{display:inline-flex;margin-top:9px;text-decoration:none;border-radius:9px;padding:9px 12px;background:#eaf0ff;font-weight:650}.date-link.disabled{color:#7d8999;background:#e9edf4;pointer-events:none}@media(max-width:600px){.row{grid-template-columns:1fr}.detail{padding:17px}h1{font-size:23px}}</style></head><body><div class="wrap"><header><div><h1>🎓 우리집 대학입시 일정</h1><p>대학별 지원 정보 · 발표 일정 · 면접 장소</p></div><button id="export">자료 백업(JSON)</button></header><div id="home"><div class="toolbar"><input id="search" placeholder="대학교 또는 모집단위 검색" style="max-width:350px"/><button id="importBtn">백업 복원</button><input id="importFile" type="file" accept=".json,application/json" hidden/></div><div class="grid" id="grid"></div></div><div id="detail" class="hidden"><button id="back">← 대학 목록으로</button><section class="detail"><h2 id="schoolTitle"></h2><p id="schoolSubtitle"></p><div class="row"><div><label for="number">수험번호</label><input id="number" placeholder="수험번호 입력" autocomplete="off"/></div><div><label for="status">진행 상태</label><input id="status" placeholder="예: 서류접수 완료, 면접 준비 중"/></div></div><div class="row"><div class="datebox"><label for="first">1차 합격자 발표</label><input id="first" type="datetime-local"/></div><div class="datebox"><label for="interview">면접 날짜</label><input id="interview" type="datetime-local"/><div class="hint">면접 장소를 입력하면 아래 지도 버튼이 활성화됩니다.</div></div></div><div class="row"><div class="datebox"><label for="final">최종 합격자 발표</label><input id="final" type="datetime-local"/></div><div class="datebox"><label for="venue">면접 장소 (건물·주소)</label><input id="venue" placeholder="예: ○○대학교 ○○관, ○○시 ○○로"/><a id="mapLink" class="date-link disabled" target="_blank" rel="noopener noreferrer">📍 면접 장소 지도 열기</a></div></div><label for="notes">메모</label><input id="notes" placeholder="준비물, 입실 시간, 안내 링크 등"/><div class="actions"><button class="primary" id="save">저장하기</button><button id="calendar">면접 일정 캘린더 파일(.ics)</button></div><p class="hint">입력 정보는 이 브라우저에만 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우면 사라질 수 있으니 백업 기능을 이용하세요.</p></section></div><p class="foot">※ 일정과 장소는 직접 입력하는 관리용 페이지입니다. 공식 입학처 공지와 대조해 주세요.</p></div><script>
const schools=[['kaist','카이스트','무학과'],['gist','지스트','무학과'],['unist','유니스트','무학과'],['dgist','디지스트','무학과'],['kentech','켄텍','무학과'],['sogang','서강대학교','무학과'],['skku-physics','성균관대학교','물리학과'],['skku-engineering','성균관대학교','공학계열'],['hanyang','한양대학교','모집단위 미입력'],['postech','포스텍','모집단위 미입력']];
const fields=['number','status','first','interview','final','venue','notes'];const storageKey='admission-planner-2027-v1';let data={};try{data=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}let current=null;const $=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem(storageKey,JSON.stringify(data))}function fmt(d){if(!d)return '일정 미입력';return d.replace('T',' ')}function render(){let q=$('search').value.trim().toLowerCase();$('grid').innerHTML=schools.filter(s=>s.slice(1).join(' ').toLowerCase().includes(q)).map(([id,name,major])=>{let a=data[id]||{};return `<button class="school" data-id="${id}"><strong>${escapeHtml(name)}</strong><small>${escapeHtml(major)}</small><br><span class="pill">면접: ${escapeHtml(fmt(a.interview))}</span></button>`}).join('');document.querySelectorAll('.school').forEach(b=>b.onclick=()=>openSchool(b.dataset.id))}function openSchool(id){current=id;let s=schools.find(x=>x[0]===id),a=data[id]||{};$('schoolTitle').textContent=s[1];$('schoolSubtitle').textContent=s[2];fields.forEach(f=>$(f).value=a[f]||'');$('home').classList.add('hidden');$('detail').classList.remove('hidden');updateMap();location.hash=encodeURIComponent(id);window.scrollTo(0,0)}function updateMap(){let v=$('venue').value.trim(),link=$('mapLink');if(v){link.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v);link.classList.remove('disabled');link.textContent='📍 면접 장소 지도 열기'}else{link.removeAttribute('href');link.classList.add('disabled');link.textContent='📍 면접 장소를 먼저 입력하세요'}}$('venue').addEventListener('input',updateMap);$('save').onclick=()=>{data[current]=Object.fromEntries(fields.map(f=>[f,$(f).value]));persist();alert('저장했습니다.');render()};function goHome(){current=null;$('detail').classList.add('hidden');$('home').classList.remove('hidden');history.replaceState(null,'',location.pathname+location.search);render()}$('back').onclick=goHome;$('search').oninput=render;function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('export').onclick=()=>download('대학입시일정_백업.json',JSON.stringify({version:1,data},null,2),'application/json');$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let parsed=JSON.parse(await file.text());if(!parsed.data||typeof parsed.data!=='object')throw Error();if(!confirm('현재 저장된 내용을 백업 파일로 교체할까요?'))return;data=parsed.data;persist();render();alert('복원했습니다.')}catch(err){alert('올바른 백업 파일이 아닙니다.')}e.target.value=''};function icsDate(v){return v.replace(/[-:]/g,'').replace('T','T')+'00'}$('calendar').onclick=()=>{let v=$('interview').value;if(!v){alert('면접 날짜를 입력해 주세요.');return}let s=schools.find(x=>x[0]===current),venue=$('venue').value;let start=new Date(v),end=new Date(start.getTime()+60*60000);let fmtLocal=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('')+'T'+[String(d.getHours()).padStart(2,'0'),String(d.getMinutes()).padStart(2,'0'),'00'].join('');let clean=x=>x.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');let ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Admissions Planner//KO','BEGIN:VEVENT','UID:'+current+'-'+Date.now()+'@admissions.local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'') ,'DTSTART:'+fmtLocal(start),'DTEND:'+fmtLocal(end),'SUMMARY:'+clean(s[1]+' '+s[2]+' 면접'),'LOCATION:'+clean(venue),'DESCRIPTION:'+clean($('notes').value),'END:VEVENT','END:VCALENDAR'].join('\r\n');download(s[1]+'_면접일정.ics',ics,'text/calendar;charset=utf-8')};render();let hash=decodeURIComponent(location.hash.slice(1));if(schools.some(s=>s[0]===hash))openSchool(hash);
</script></body></html>
