<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리집 대학입시 일정</title><style>:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#18253d;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:27px;margin:0}p{color:#66748a}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,.btn{border:1px solid #d9e1ef;background:white;border-radius:10px;padding:10px 13px;font-weight:650;cursor:pointer;color:#263b61}button:hover,.btn:hover{background:#eef3ff}.primary{background:#2456d6;color:white;border-color:#2456d6}.primary:hover{background:#1944b4}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:13px}.school{background:white;border:1px solid #e1e6f0;border-radius:16px;padding:18px;text-align:left;min-height:140px;box-shadow:0 3px 12px #1a3b7010}.school strong{display:block;font-size:18px}.school small{color:#66748a}.pill{display:inline-block;background:#edf3ff;color:#2352bd;border-radius:20px;padding:5px 9px;font-size:12px;margin-top:16px}.detail{background:white;border:1px solid #e1e6f0;border-radius:16px;padding:24px;margin-top:18px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #cdd7e6;border-radius:9px;font:inherit}input:focus{outline:2px solid #b2c8ff}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.datebox{background:#f6f8fd;border:1px solid #e0e7f3;border-radius:12px;padding:12px;margin-top:14px}.datebox label{margin-top:0}.hint{font-size:12px;color:#6d7c91}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.hidden{display:none}.foot{font-size:12px;margin-top:24px}a{color:#2456d6}.date-link{display:inline-flex;margin-top:9px;text-decoration:none;border-radius:9px;padding:9px 12px;background:#eaf0ff;font-weight:650}.date-link.disabled{color:#7d8999;background:#e9edf4;pointer-events:none}@media(max-width:600px){.row{grid-template-columns:1fr}.detail{padding:17px}h1{font-size:23px}}</style><style>
body.site-locked .wrap{display:none}
#loginGate{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px;background:#f5f7fb}
body.site-locked #loginGate{display:flex}
#loginPanel{width:100%;max-width:390px;background:white;border:1px solid #e1e6f0;border-radius:18px;padding:30px;box-shadow:0 8px 30px #1a3b7015}
#loginPanel h2{margin:0 0 10px;font-size:23px}
#loginPanel p{line-height:1.5}
#loginPanel input{margin:8px 0 14px}
#loginPanel button{width:100%}
#loginError{color:#ba2535;font-size:13px;min-height:20px;margin-top:12px}
</style><script>if(sessionStorage.getItem('admissions-family-unlocked')!=='yes')document.documentElement.classList.add('login-pending');</script><style>.login-pending body .wrap{display:none}.login-pending body #loginGate{display:flex}</style></head><body class="site-locked"><div id="loginGate"><form id="loginPanel"><h2>🔒 우리집 대학입시 일정</h2><p>가족 공용 비밀번호를 입력해 주세요.</p><label for="familyPassword">비밀번호</label><input id="familyPassword" type="password" autocomplete="current-password" required placeholder="비밀번호 입력"/><button class="primary" type="submit">홈페이지 들어가기</button><div id="loginError" role="alert" aria-live="polite"></div></form></div><div class="wrap"><header><div><h1>🎓 우리집 대학입시 일정</h1><p>대학별 지원 정보 · 발표 일정 · 면접 장소</p></div><button id="export">자료 백업(JSON)</button></header><div id="home"><div class="toolbar"><input id="search" placeholder="대학교 또는 모집단위 검색" style="max-width:350px"/><button id="importBtn">백업 복원</button><input id="importFile" type="file" accept=".json,application/json" hidden/></div><div class="grid" id="grid"></div></div><div id="detail" class="hidden"><button id="back">← 대학 목록으로</button><section class="detail"><h2 id="schoolTitle"></h2><p id="schoolSubtitle"></p><div class="row"><div><label for="number">수험번호</label><input id="number" placeholder="수험번호 입력" autocomplete="off"/></div></div><div class="row"><div class="datebox"><label for="first">1차 합격자 발표</label><input id="first" type="datetime-local"/><div id="firstResultBox" class="hidden"><label for="firstResult">1차 합격 여부</label><select id="firstResult" style="width:100%;padding:12px;border:1px solid #cdd7e6;border-radius:9px;font:inherit"><option value="">미선택</option><option value="pass">합격</option><option value="fail">불합격</option></select></div></div><div class="datebox" id="interviewBox"><label for="interview">면접 날짜</label><input id="interview" type="datetime-local"/><div class="hint">면접 장소를 입력하면 아래 지도 버튼이 활성화됩니다.</div></div></div><div class="row"><div class="datebox" id="finalBox"><label for="final">최종 합격자 발표</label><input id="final" type="datetime-local"/></div><div class="datebox" id="venueBox"><label for="venue">면접 장소 (건물·주소)</label><input id="venue" placeholder="예: ○○대학교 ○○관, ○○시 ○○로"/><a id="mapLink" class="date-link disabled" target="_blank" rel="noopener noreferrer">📍 면접 장소 지도 열기</a></div></div><label for="notes">메모</label><input id="notes" placeholder="준비물, 입실 시간, 안내 링크 등"/><div class="actions"><button class="primary" id="save">저장하기</button><button id="calendar">면접 일정 캘린더 파일(.ics)</button></div><p class="hint">입력 정보는 이 브라우저에만 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우면 사라질 수 있으니 백업 기능을 이용하세요.</p></section></div><p class="foot">※ 일정과 장소는 직접 입력하는 관리용 페이지입니다. 공식 입학처 공지와 대조해 주세요.</p></div><script>
const schools=[['kaist','카이스트','무학과'],['gist','지스트','무학과'],['unist','유니스트','무학과'],['dgist','디지스트','무학과'],['kentech','켄텍','무학과'],['sogang','서강대학교','무학과'],['skku-physics','성균관대학교','물리학과'],['skku-engineering','성균관대학교','공학계열'],['hanyang','한양대학교','모집단위 미입력'],['postech','포스텍','모집단위 미입력'],['my-love-birthday','내사랑 생일','🎂 11월 7일']];
const fields=['number','first','interview','final','venue','notes'];const kaistDates={first:'2026-11-11',interview:'2026-11-26',final:'2026-12-18'};const hanyangDates={first:'2026-11-13',interview:'2026-11-22'};const fixedDates={kaist:kaistDates,hanyang:hanyangDates,'my-love-birthday':{first:'2026-11-07'}};const storageKey='admission-planner-2027-v1';let data={};try{data=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}let current=null;const $=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem(storageKey,JSON.stringify(data))}function fmt(d){if(!d)return '일정 미입력';return d.endsWith('T00:00')?d.slice(0,10):d.replace('T',' ')}function resultFor(id){return (data[id]||{}).firstResult||''}function isFailed(id){return id==='kaist'&&resultFor(id)==='fail'}function updateResultVisibility(){let k=current==='kaist';$('firstResultBox').classList.toggle('hidden',!k);let failed=k&&$('firstResult').value==='fail';['interviewBox','finalBox','venueBox'].forEach(id=>$(id).classList.toggle('hidden',failed));$('calendar').classList.toggle('hidden',failed)}$('firstResult').addEventListener('change',updateResultVisibility);function render(){let q=$('search').value.trim().toLowerCase();$('grid').innerHTML=schools.filter(s=>s.slice(1).join(' ').toLowerCase().includes(q)).map(([id,name,major])=>{let a=data[id]||{};return `<button class="school" data-id="${id}"><strong>${escapeHtml(name)}</strong><small>${escapeHtml(major)}</small><br><span class="pill">${id==='my-love-birthday'?'🎂 생일: 11월 7일':'1차 발표: '+escapeHtml(fmt((fixedDates[id]&&fixedDates[id].first)||a.first))}</span></button>`}).join('');document.querySelectorAll('.school').forEach(b=>b.onclick=()=>openSchool(b.dataset.id))}function openSchool(id){current=id;let s=schools.find(x=>x[0]===id),a=data[id]||{};$('schoolTitle').textContent=s[1];$('schoolSubtitle').textContent=s[2];['first','interview','final'].forEach(f=>$(f).type=fixedDates[id]&&fixedDates[id][f]?'date':'datetime-local');fields.forEach(f=>{let v=a[f]||'';if(fixedDates[id]&&fixedDates[id][f])v=fixedDates[id][f];$(f).value=v});$('firstResult').value=a.firstResult||'';updateResultVisibility();$('home').classList.add('hidden');$('detail').classList.remove('hidden');updateMap();location.hash=encodeURIComponent(id);window.scrollTo(0,0)}function updateMap(){let v=$('venue').value.trim(),link=$('mapLink');if(v){link.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v);link.classList.remove('disabled');link.textContent='📍 면접 장소 지도 열기'}else{link.removeAttribute('href');link.classList.add('disabled');link.textContent='📍 면접 장소를 먼저 입력하세요'}}$('venue').addEventListener('input',updateMap);$('save').onclick=()=>{data[current]={...Object.fromEntries(fields.map(f=>[f,$(f).value])),firstResult:current==='kaist'?$('firstResult').value:(data[current]||{}).firstResult||''};persist();alert('저장했습니다.');render()};function goHome(){current=null;$('detail').classList.add('hidden');$('home').classList.remove('hidden');history.replaceState(null,'',location.pathname+location.search);render()}$('back').onclick=goHome;$('search').oninput=render;function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('export').onclick=()=>download('대학입시일정_백업.json',JSON.stringify({version:1,data},null,2),'application/json');$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let parsed=JSON.parse(await file.text());if(!parsed.data||typeof parsed.data!=='object')throw Error();if(!confirm('현재 저장된 내용을 백업 파일로 교체할까요?'))return;data=parsed.data;persist();render();alert('복원했습니다.')}catch(err){alert('올바른 백업 파일이 아닙니다.')}e.target.value=''};function icsDate(v){return v.replace(/[-:]/g,'').replace('T','T')+'00'}$('calendar').onclick=()=>{let v=$('interview').value;if(current==='kaist'&&$('firstResult').value==='fail'){alert('1차 불합격 상태에서는 면접 일정이 없습니다.');return}if(!v){alert('면접 날짜를 입력해 주세요.');return}let s=schools.find(x=>x[0]===current),venue=$('venue').value;let start=new Date(v),end=new Date(start.getTime()+60*60000);let fmtLocal=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('')+'T'+[String(d.getHours()).padStart(2,'0'),String(d.getMinutes()).padStart(2,'0'),'00'].join('');let clean=x=>x.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');let ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Admissions Planner//KO','BEGIN:VEVENT','UID:'+current+'-'+Date.now()+'@admissions.local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'') ,'DTSTART:'+fmtLocal(start),'DTEND:'+fmtLocal(end),'SUMMARY:'+clean(s[1]+' '+s[2]+' 면접'),'LOCATION:'+clean(venue),'DESCRIPTION:'+clean($('notes').value),'END:VEVENT','END:VCALENDAR'].join('\r\n');download(s[1]+'_면접일정.ics',ics,'text/calendar;charset=utf-8')};render();let hash=decodeURIComponent(location.hash.slice(1));if(schools.some(s=>s[0]===hash))openSchool(hash);
</script><script>
(function(){
const unlockedKey='admissions-family-unlocked';
function unlock(){document.body.classList.remove('site-locked');document.documentElement.classList.remove('login-pending');document.getElementById('familyPassword').value=''}
if(sessionStorage.getItem(unlockedKey)==='yes'){unlock();return}
document.getElementById('loginPanel').addEventListener('submit',async function(e){
e.preventDefault();
const password=document.getElementById('familyPassword').value;
const bytes=new TextEncoder().encode(password);
const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(b=>b.toString(16).padStart(2,'0')).join('');
if(hash==='e263e052c7cdd3fcdaaaad8384a138ac8ef4ff736e4afcadc472fb520db6ebe9'){sessionStorage.setItem(unlockedKey,'yes');unlock()}
else{document.getElementById('loginError').textContent='비밀번호가 일치하지 않습니다.';document.getElementById('familyPassword').select()}
});
})();
</script></body></html>
